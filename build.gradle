plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.18.1'
}

group 'com.naixiaoxin.idea.hyperf'
version '1.0.3'

repositories {
    maven { url 'https://maven.aliyun.com/repository/public/' }
    mavenLocal()
    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        phpstorm(ideaVersion)
        bundledPlugins(['com.jetbrains.php'])
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Exclude legacy tests that rely on removed test framework classes; they are kept
// in source for reference but not compiled.
sourceSets {
    test {
        java {
            exclude 'com/naixiaoxin/idea/hyperf/**'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

intellijPlatform {
    pluginConfiguration {
        name = 'Hyperf Plugin'
        ideaVersion {
            sinceBuild = '262'
        }
    }
}

// The local JDK 25 distribution is not a JetBrains Runtime and lacks the
// JBR-specific 'Packages' directory that the instrumentCode task expects.
// Bytecode instrumentation only adds @NotNull runtime assertions; disabling
// it does not affect plugin functionality.
tasks.named('instrumentCode') {
    enabled = false
}

def htmlFixer = { htmlFile -> file(htmlFile).text.replace('<html>', '').replace('</html>', '') }

patchPluginXml {
    changeNotes = htmlFixer('./changelog.html')
}
