plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.18.1'
}

group 'com.base.idea.hyperf'
version '1.0.4'

repositories {
    maven { url 'https://maven.aliyun.com/repository/public/' }
    mavenLocal()
    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        phpstorm(ideaVersion)
        bundledPlugins(['com.jetbrains.php', 'org.jetbrains.plugins.terminal'])
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Exclude legacy tests that rely on removed test framework classes; they are kept
// in source for reference but not compiled.
sourceSets {
    test {
        java {
            exclude 'com/base/idea/hyperf/ConfigTest.java'
            exclude 'com/base/idea/hyperf/HyperflLightCodeInsightFixtureTestCase.java'
        }
    }
}

// 字节码按 17 出包：233~2024.2 的 IDE 跑在 JBR 17 上，toolchain(JDK 25) 仅作编译器。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

intellijPlatform {
    pluginConfiguration {
        name = 'Hyperf Base'
        ideaVersion {
            sinceBuild = '233'
        }
    }
    // 本地 JDK 25 不是 JetBrains Runtime，缺少 JBR 特有的 Packages 目录，插桩会报错。
    // 插桩仅提供 @NotNull 运行时断言，禁用不影响功能；同时覆盖 main/test 两个插桩任务。
    instrumentCode = false
}

// 可选：-PopenProject=<路径> 让沙箱 IDE 启动后直接打开指定项目
tasks.named('runIde') {
    if (project.hasProperty('openProject')) {
        args project.property('openProject')
    }
}

// 从 CHANGELOG.md 提取首个版本段的 `- ` 条目，转成 changeNotes 的 <ul><li> HTML
def latestChangeNotes = { ->
    def md = file('CHANGELOG.md').text
    def matcher = md =~ /(?ms)^## +\[[^\]]+\][^\n]*\n(.*?)(?=^## |\z)/
    if (!matcher.find()) {
        return ''
    }
    def items = matcher.group(1).readLines()
            .findAll { it.trim().startsWith('- ') }
            .collect { '<li>' + it.trim().substring(2).replaceAll(/`([^`]+)`/, '<code>$1</code>') + '</li>' }
    return items.isEmpty() ? '' : '<ul>' + items.join('') + '</ul>'
}

patchPluginXml {
    changeNotes = latestChangeNotes()
}
