plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.18.1'
}

group 'com.base.idea.hyperf'
version '1.0.3'

repositories {
    maven { url 'https://maven.aliyun.com/repository/public/' }
    mavenLocal()
    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        phpstorm(ideaVersion)
        bundledPlugins(['com.jetbrains.php', 'org.jetbrains.plugins.terminal'])
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Exclude legacy tests that rely on removed test framework classes; they are kept
// in source for reference but not compiled.
sourceSets {
    test {
        java {
            exclude 'com/base/idea/hyperf/ConfigTest.java'
            exclude 'com/base/idea/hyperf/HyperflLightCodeInsightFixtureTestCase.java'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

intellijPlatform {
    pluginConfiguration {
        name = 'Hyperf Base'
        ideaVersion {
            sinceBuild = '262'
        }
    }
    // 本地 JDK 25 不是 JetBrains Runtime，缺少 JBR 特有的 Packages 目录，插桩会报错。
    // 插桩仅提供 @NotNull 运行时断言，禁用不影响功能；同时覆盖 main/test 两个插桩任务。
    instrumentCode = false
}

// 可选：-PopenProject=<路径> 让沙箱 IDE 启动后直接打开指定项目
tasks.named('runIde') {
    if (project.hasProperty('openProject')) {
        args project.property('openProject')
    }
}

def htmlFixer = { htmlFile -> file(htmlFile).text.replace('<html>', '').replace('</html>', '') }

patchPluginXml {
    changeNotes = htmlFixer('./changelog.html')
}
